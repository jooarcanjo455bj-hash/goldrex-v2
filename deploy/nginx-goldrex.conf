# Nginx na frente do GOLDREX (VPS Hostinger).
# Copie para /etc/nginx/sites-available/goldrex, troque SEUDOMINIO.com.br e ative (veja docs/HOSTINGER.md).
# Depois rode: sudo certbot --nginx -d SEUDOMINIO.com.br -d www.SEUDOMINIO.com.br   (o Certbot cria o bloco HTTPS e o redirecionamento)

upstream goldrex_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name SEUDOMINIO.com.br www.SEUDOMINIO.com.br;

    # Vídeos: o limite precisa ser MAIOR que MAX_UPLOAD_MB do .env (padrão 50). Sem isso o Nginx recusa com "413".
    client_max_body_size 64m;

    # Envios grandes precisam de prazos longos.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # IP real do visitante (o app usa para bloquear tentativas)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    1h;
    proxy_read_timeout    1h;

    # Envio de foto/vídeo do painel: repassa direto para o app sem guardar no disco do Nginx.
    location /api/admin/ {
        proxy_request_buffering off;
        proxy_pass http://goldrex_app;
    }

    # Entrega de vídeo/foto original (suporta "Range" para avançar o vídeo): sem buffer em disco.
    location /media/ {
        proxy_buffering off;
        proxy_pass http://goldrex_app;
    }
    location /uploads/ {
        proxy_buffering off;
        proxy_pass http://goldrex_app;
    }

    location / {
        proxy_pass http://goldrex_app;
    }
}
